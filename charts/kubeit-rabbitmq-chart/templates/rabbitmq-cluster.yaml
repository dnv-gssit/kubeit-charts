---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.tenantName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "kubeit-rabbit-chart.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  image: {{ .Values.rabbitmqCluster.image }}
  replicas: {{ .Values.rabbitmqCluster.spec.replicas }}
{{- $externalScName := include "kubeit-rabbit-chart.storageClassName" . }}
{{- if and .Values.persistentVolume.storageClassName (ne .Values.persistentVolume.storageClassName "azurefile-csi") }}
{{- $externalScName = .Values.persistentVolume.storageClassName }}
{{- end }}
{{- if .Values.rabbitmqCluster.defaultUserSecret }}
  secretBackend:
    externalSecret:
      name: {{ .Values.rabbitmqCluster.defaultUserSecret }}
{{- end }}
  resources:
    requests:
      cpu: {{ .Values.rabbitmqCluster.spec.resources.requests.cpu }}
      memory: {{ .Values.rabbitmqCluster.spec.resources.requests.memory }}
    limits:
     memory: {{ .Values.rabbitmqCluster.spec.resources.limits.memory }}
     cpu: {{ .Values.rabbitmqCluster.spec.resources.limits.cpu }}
  override:
    service:
      metadata:
        labels:
          {{- include "kubeit-rabbit-chart.selectorLabels" . | nindent 10 }}
    # The operator manages the service account and capabilities; only override
    # pod and container settings accepted by the RabbitMQ CRD webhook.
    statefulSet:
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 1001
              runAsNonRoot: true
              runAsGroup: 999
            containers:
              - name: rabbitmq
                securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  readOnlyRootFilesystem: true
                volumeMounts:
                  - mountPath: /tmp
                    name: rabbitmq-tmp
                {{- if .Values.persistentVolume.external }}
                  - mountPath: /var/lib/rabbitmq/mnesia/
                    name: {{ .Values.rabbitmqCluster.spec.containers.volumeMount.name }}
                {{- end }}
                {{- if .Values.persistentVolume.env }}
                env:
                  {{- range .Values.persistentVolume.env }}
                  - name: {{ .name }}
                    value: {{ .value | quote }}
                  {{- end }}
                {{- end }}
                {{- if .Values.rabbitmqCluster.spec.nofile.soft }}
                command: ["/bin/sh", "-ec"]
                args:
                  - |
                    ulimit -n {{ .Values.rabbitmqCluster.spec.nofile.soft }}
                    exec rabbitmq-server
                {{- end }}
            initContainers:
              - name: setup-container
                securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                resources:
                  requests:
                    cpu: 20m
                    memory: 32Mi
                  limits:
                    memory: 50Mi
                volumeMounts:
                  - mountPath: /tmp
                    name: rabbitmq-tmp
                {{- if .Values.persistentVolume.external }}
                  - mountPath: /var/lib/rabbitmq/mnesia/
                    name: {{ .Values.rabbitmqCluster.spec.initContainers.volumeMount.name }}
                {{- end }}
            volumes:
              - name: rabbitmq-tmp
                emptyDir: {}
        {{- if .Values.persistentVolume.external }}
        volumeClaimTemplates:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            spec:
              accessModes:
                {{- range .Values.persistentVolume.accessModes }}
                - {{ . }}
                {{- end }}
              # Empty string = static binding: no dynamic provisioning, bind to a
              # pre-created static PersistentVolume instead of a StorageClass.
              storageClassName: ""
              resources:
                requests:
                  storage: {{ .Values.persistentVolume.capacity.storage }}
            metadata:
              name: {{ .Values.rabbitmqCluster.spec.containers.volumeMount.name }}
        {{- end }}
  rabbitmq:
    additionalConfig: |
      {{ .Values.rabbitmqCluster.additionalConfig | nindent 6 }}
      cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
      cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    {{- if .Values.rabbitmqCluster.advancedConfig }}
    advancedConfig: |
      {{ .Values.rabbitmqCluster.advancedConfig | nindent 6 }}
    {{- end }}
    {{- if .Values.rabbitmqCluster.additionalPlugins }}
    additionalPlugins: |
    {{- range .Values.rabbitmqCluster.additionalPlugins }}
      - {{ . }}
    {{- end }}
    {{- end }}
  terminationGracePeriodSeconds: 60
  {{- if .Values.rabbitmqCluster.tls.enabled }}
  tls:
    secretName: {{ .Values.rabbitmqCluster.tls.secretName }}
  {{- end }}
  persistence:
    storage: {{ .Values.persistentVolume.capacity.storage }}
    {{- if .Values.persistentVolume.external }}
    # Empty string = static binding to the pre-created PersistentVolume(s).
    storageClassName: ""
    {{- else }}
    storageClassName: {{ required "A storage class name is required" .Values.persistentVolume.storageClassName }}
    {{- end }}
  service:
    type: {{ .Values.service.type }}
