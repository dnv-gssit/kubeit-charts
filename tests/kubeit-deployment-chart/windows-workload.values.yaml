---
app: test-windows

# Flag the workload as Windows: renders spec.os.name: windows and strips the
# Linux-only securityContext fields the API server rejects for Windows Pods.
os:
  windows: true

# Linux-oriented contexts below: the forbidden fields must be omitted from the
# rendered output, leaving only the Windows-compatible ones (runAsNonRoot).
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsUser: 1000
  runAsGroup: 3000
  runAsNonRoot: true

nodeSelector:
  kubernetes.io/os: windows
